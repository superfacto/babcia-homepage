<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gazeta Babci</title>
<style>
  :root {
    --paper: #fbf8f1; --ink: #1f1b18; --muted: #6b625b; --rule: #d9cfc0; --red: #c8102e; --red-soft: #fbe9ec;
  }
  * { box-sizing: border-box; }
  html { font-size: 20px; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; line-height: 1.45; }
  .wrap { max-width: 1150px; margin: 0 auto; padding: 18px 16px 60px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: system-ui, -apple-system, sans-serif; font-size: .8rem; }
  .top a { color: var(--red); text-decoration: none; font-weight: 600; }
  .top button { font: inherit; border: 1px solid var(--rule); background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; color: var(--muted); }

  .masthead { text-align: center; border-bottom: 4px double var(--ink); padding: 14px 0 10px; margin-bottom: 8px; }
  .masthead h1 { font-size: 3.2rem; margin: 0; letter-spacing: .01em; line-height: 1; font-weight: 700; }
  .masthead .sub { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--ink); margin-top: 12px; padding-top: 6px;
    font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  nav.sections { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 12px 0 16px; border-bottom: 1px solid var(--rule); }
  nav.sections a { font-family: system-ui, -apple-system, sans-serif; font-size: .8rem; font-weight: 600; text-decoration: none; color: var(--ink);
    border: 1px solid var(--rule); background: #fff; padding: 7px 14px; border-radius: 999px; }
  nav.sections a:hover { border-color: var(--red); color: var(--red); }

  .front { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; padding: 22px 0; border-bottom: 2px solid var(--ink); }
  .lead-story img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; margin-bottom: 12px; }
  .lead-story h2 { font-size: 2rem; line-height: 1.15; margin: 4px 0 10px; }
  .lead-story p { font-size: 1.05rem; margin: 0 0 10px; }
  .side-stories article { padding: 0 0 14px; margin-bottom: 14px; border-bottom: 1px solid var(--rule); }
  .side-stories article:last-child { border-bottom: 0; margin-bottom: 0; }
  .side-stories h3 { font-size: 1.1rem; line-height: 1.25; margin: 4px 0 6px; }
  .side-stories p { font-size: .85rem; margin: 0; color: #3b3430; }

  .kicker { font-family: system-ui, -apple-system, sans-serif; font-size: .65rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
  .time { font-family: system-ui, -apple-system, sans-serif; font-size: .7rem; color: var(--muted); }
  .prem { font-family: system-ui, -apple-system, sans-serif; font-size: .6rem; font-weight: 700; color: #8a6d00; background: #fff4cc; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  a.more { display: inline-block; margin-top: 6px; font-family: system-ui, -apple-system, sans-serif; font-size: .75rem; font-weight: 600; color: var(--red); text-decoration: none; }
  a.more:hover { text-decoration: underline; }
  h2 a, h3 a { color: inherit; text-decoration: none; }
  h2 a:hover, h3 a:hover { text-decoration: underline; }

  .grid { columns: 2; column-gap: 36px; }
  section.sec { break-inside: avoid; padding: 22px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: 10px; }
  section.sec > h2 { font-size: 1.5rem; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
  section.sec > h2 a.all { font-family: system-ui, -apple-system, sans-serif; font-size: .7rem; font-weight: 600; color: var(--red); }
  .sec .first img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; margin-bottom: 8px; }
  .sec article { padding: 10px 0; border-bottom: 1px dotted var(--rule); }
  .sec article:last-child { border-bottom: 0; }
  .sec h3 { font-size: 1.05rem; line-height: 1.25; margin: 0 0 4px; }
  .sec p { font-size: .85rem; margin: 0; color: #3b3430; }

  .status { text-align: center; padding: 60px 0; color: var(--muted); }
  footer { margin-top: 30px; font-size: .7rem; color: var(--muted); text-align: center; font-family: system-ui, -apple-system, sans-serif; }
  footer a { color: inherit; }
  .totop { position: fixed; right: 16px; bottom: 16px; font-family: system-ui, sans-serif; font-size: .8rem; background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 14px; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.25); }

  @media (max-width: 820px) {
    .front { grid-template-columns: minmax(0, 1fr); }
    .grid { columns: 1; }
    .masthead h1 { font-size: 2.3rem; }
  }
  @media (max-width: 520px) {
    html { font-size: 18px; }
    .lead-story h2 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="./">← Strona główna</a>
    <a href="https://wpolityce.pl/tygodnik-sieci" target="_blank" rel="noopener">📖 Tygodnik „Sieci” →</a>
    <button type="button" id="refresh">↻ Odśwież</button>
  </div>
  <header class="masthead">
    <h1>Gazeta Babci</h1>
    <div class="sub"><span id="date"></span><span>Wiadomości z wPolityce.pl</span></div>
  </header>
  <nav class="sections" id="nav"></nav>
  <main id="paper"><div class="status">Ładowanie gazety…</div></main>
  <footer>
    Wszystkie artykuły pochodzą z <a href="https://wpolityce.pl" target="_blank" rel="noopener">wPolityce.pl</a> (oficjalne kanały RSS) — kliknij „Czytaj całość”, aby przeczytać artykuł na ich stronie.
    Artykuły oznaczone „Premium” wymagają subskrypcji. <span id="updated"></span>
  </footer>
</div>
<a class="totop" href="#">↑ Do góry</a>

<script>
const TZ = "Pacific/Auckland";
const esc = (s = "") => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = (iso) => {
  const d = new Date(iso), now = new Date();
  const mins = Math.round((now - d) / 60000);
  if (mins < 60) return `${Math.max(mins, 1)} min temu`;
  if (mins < 24 * 60) return `${Math.round(mins / 60)} godz. temu`;
  return new Intl.DateTimeFormat("pl-PL", { weekday: "short", day: "numeric", month: "long", timeZone: TZ }).format(d);
};
const prem = (it) => it.premium ? `<span class="prem">PREMIUM</span>` : "";
const more = (it) => `<a class="more" href="${esc(it.link)}" target="_blank" rel="noopener">Czytaj całość →</a>`;
const img = (it) => it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy" onerror="this.remove()">` : "";

document.getElementById("date").textContent =
  new Intl.DateTimeFormat("pl-PL", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: TZ }).format(new Date());

async function load() {
  const paper = document.getElementById("paper");
  let data;
  try {
    const r = await fetch("/api/gazeta", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
  } catch (e) {
    // local preview (python http.server has no functions): use a saved sample
    try { data = await (await fetch("gazeta-sample.json")).json(); }
    catch { paper.innerHTML = `<div class="status">Nie udało się pobrać gazety. Spróbuj za chwilę (↻ Odśwież).</div>`; return; }
  }
  const sections = data.sections
    .map(s => ({ ...s, items: [...s.items].sort((a, b) => new Date(b.date) - new Date(a.date)) }))
    .filter(s => s.items.length);

  // Front page: newest stories from Kraj / Polityka / Świat
  const pool = sections.filter(s => ["kraj", "polityka", "swiat"].includes(s.slug))
    .flatMap(s => s.items.map(it => ({ ...it, sec: s.name })))
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  const lead = pool.find(it => it.img && !it.premium) || pool[0];
  const side = pool.filter(it => it !== lead).slice(0, 4);
  const used = new Set([lead, ...side].filter(Boolean).map(i => i.link));

  document.getElementById("nav").innerHTML = sections.map(s => `<a href="#${s.slug}">${esc(s.name)}</a>`).join("");

  const front = lead ? `
    <div class="front">
      <article class="lead-story">
        ${img(lead)}
        <div class="kicker">${esc(lead.sec)}</div>
        <h2><a href="${esc(lead.link)}" target="_blank" rel="noopener">${esc(lead.title)}</a>${prem(lead)}</h2>
        <p>${esc(lead.lead)}</p>
        <div class="time">${when(lead.date)}</div>
        ${more(lead)}
      </article>
      <div class="side-stories">
        ${side.map(it => `<article>
          <div class="kicker">${esc(it.sec)}</div>
          <h3><a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>${prem(it)}</h3>
          <p>${esc(it.lead)}</p>
          <div class="time">${when(it.date)}</div>
        </article>`).join("")}
      </div>
    </div>` : "";

  const secs = sections.map(s => {
    const items = s.items.filter(it => !used.has(it.link)).slice(0, 6);
    if (!items.length) return "";
    const [first, ...rest] = items;
    return `<section class="sec" id="${s.slug}">
      <h2>${esc(s.name)} <a class="all" href="https://wpolityce.pl/${s.slug === "tygodniksieci" ? "tygodnik-sieci/" + new Date().getFullYear() : s.slug}" target="_blank" rel="noopener">więcej →</a></h2>
      <article class="first">
        ${img(first)}
        <h3><a href="${esc(first.link)}" target="_blank" rel="noopener">${esc(first.title)}</a>${prem(first)}</h3>
        <p>${esc(first.lead)}</p>
        <div class="time">${when(first.date)}</div>
        ${more(first)}
      </article>
      ${rest.map(it => `<article>
        <h3><a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>${prem(it)}</h3>
        <p>${esc(it.lead)}</p>
        <div class="time">${when(it.date)} · <a class="more" href="${esc(it.link)}" target="_blank" rel="noopener">Czytaj całość →</a></div>
      </article>`).join("")}
    </section>`;
  });
  paper.innerHTML = front + `<div class="grid">${secs.join("")}</div>`;
  document.getElementById("updated").textContent = "Zaktualizowano: " +
    new Intl.DateTimeFormat("pl-PL", { hour: "2-digit", minute: "2-digit", timeZone: TZ }).format(new Date(data.updated)) + ".";
}
document.getElementById("refresh").onclick = load;
load();
</script>
</body>
</html>
